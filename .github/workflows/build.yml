name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-temp -Force
          $ffmpegExe = (Get-ChildItem -Path ffmpeg-temp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Path ffmpeg -Force
          Copy-Item $ffmpegExe ffmpeg/
          Write-Host "Bundled ffmpeg.exe: $((Get-Item ffmpeg/ffmpeg.exe).Length / 1MB) MB"

      - name: Build executable
        run: pyinstaller sonotype.spec --noconfirm

      - name: Package
        shell: pwsh
        run: |
          $dir = "Sonotype-Windows"
          New-Item -ItemType Directory -Path $dir -Force
          Copy-Item -Path "dist/Sonotype.exe" -Destination "$dir/"
          Copy-Item -Path "README.md" -Destination "$dir/"
          Copy-Item -Path "LICENSE" -Destination "$dir/"
          Compress-Archive -Path "$dir/*" -DestinationPath "Sonotype-Windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonotype-Windows-x64
          path: Sonotype-Windows-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Sonotype-Windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}