<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: rounded square -->
  <rect width="512" height="512" rx="112" ry="112" fill="#2463eb"/>

  <!-- Waveform bars on the left, transitioning to text lines on the right -->
  <!-- The bars decrease in height and increase in spacing → becoming text lines -->

  <!-- Waveform (left side, taller bars, tight spacing) -->
  <rect x="80"  y="196" width="16" height="120" rx="8" fill="#fff" opacity="0.95"/>
  <rect x="108" y="156" width="16" height="200" rx="8" fill="#fff" opacity="0.95"/>
  <rect x="136" y="216" width="16" height="80"  rx="8" fill="#fff" opacity="0.95"/>
  <rect x="164" y="136" width="16" height="240" rx="8" fill="#fff" opacity="0.95"/>
  <rect x="192" y="186" width="16" height="140" rx="8" fill="#fff" opacity="0.95"/>

  <!-- Transition zone (middle, bars getting shorter, more spaced) -->
  <rect x="224" y="206" width="14" height="100" rx="7" fill="#fff" opacity="0.85"/>
  <rect x="250" y="216" width="14" height="80"  rx="7" fill="#fff" opacity="0.75"/>

  <!-- Text lines (right side, short, evenly spaced, wider) -->
  <rect x="284" y="222" width="56" height="12" rx="6" fill="#fff" opacity="0.7"/>
  <rect x="284" y="244" width="72" height="12" rx="6" fill="#fff" opacity="0.7"/>
  <rect x="284" y="266" width="48" height="12" rx="6" fill="#fff" opacity="0.7"/>
  <rect x="284" y="288" width="64" height="12" rx="6" fill="#fff" opacity="0.7"/>

  <!-- Small play triangle accent at bottom right -->
  <polygon points="392,340 412,352 392,364" fill="#fff" opacity="0.4"/>
</svg>